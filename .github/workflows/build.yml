name: Build

# On every push and pull request: builds WiiFin.dol, WiiFin.wad and the
# Homebrew Channel package (downloadable artifacts), boots the WAD and the
# DOL in Dolphin to check WiiFin reaches its menu.
#
# By hand (Actions > Build > Run workflow), a version can be stamped into
# the build, and with "release" ticked a GitHub release v<version> is
# published with the three files once every check passes.
on:
  push:
    paths-ignore: ['**.md', 'README/**', 'assets/preview*']
  pull_request:
    paths-ignore: ['**.md', 'README/**', 'assets/preview*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.3 (empty: the one in source/version.h + commit)'
        required: false
        default: ''
      release:
        description: 'Publish a GitHub release v<version> (needs a version)'
        type: boolean
        default: false

# A newer push to the same branch cancels the run in progress (not a run
# started by hand, which may publish a release)
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # devkitPPC, libogc and the portlibs come with the image: setup.sh then
    # finds them installed and never calls devkitPro's package server.
    container: devkitpro/devkitppc:latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            git make curl tar bzip2 xxd pkg-config python3 python3-venv imagemagick zip

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -n "$v" ]; then
            [[ "$v" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::bad version: $v"; exit 1; }
            sed -i "s|#define WIIFIN_VERSION \".*\"|#define WIIFIN_VERSION \"$v\"|" source/version.h
          else
            [ "$INPUT_RELEASE" = "true" ] && { echo "::error::a release needs a version"; exit 1; }
            v="$(sed -n 's/.*WIIFIN_VERSION "\(.*\)".*/\1/p' source/version.h)-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "WiiFin $v"

      # GRRLIB, mbedTLS (with WiiFin's config) and libWiiPy, then the .dol and
      # .wad; a compiler warning fails the build
      - name: Build
        env:
          WERROR: -Werror
        run: ./setup.sh

      - name: Homebrew Channel package
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p pkg/apps/WiiFin
          cp WiiFin.dol pkg/apps/WiiFin/boot.dol
          cp apps/WiiFin/meta.xml pkg/apps/WiiFin/meta.xml
          sed -i "s|<version>.*</version>|<version>$v</version>|" pkg/apps/WiiFin/meta.xml
          sed -i "s|<release_date>.*</release_date>|<release_date>$(date -u +%Y%m%d%H%M%S)</release_date>|" \
            pkg/apps/WiiFin/meta.xml
          # HBC icon: 128x48, the logo centred on transparency
          convert assets/logo_wiifin.png -trim +repage -resize 128x48 \
            -background none -gravity center -extent 128x48 pkg/apps/WiiFin/icon.png
          (cd pkg && zip -qr ../WiiFin-hbc.zip apps)

      - uses: actions/upload-artifact@v4
        with:
          name: WiiFin-${{ steps.version.outputs.version }}
          path: |
            WiiFin.dol
            WiiFin.wad
            WiiFin-hbc.zip

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/test

      - uses: actions/download-artifact@v4
        with:
          name: WiiFin-${{ needs.build.outputs.version }}

      # Dolphin's Linux build is a Flatpak; its Qt front end needs a display
      # (xvfb-run) and a session bus (dbus-run-session)
      - name: Dolphin
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends flatpak xvfb xauth dbus
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.DolphinEmu.dolphin-emu

      - name: Boot the WAD
        run: dbus-run-session -- xvfb-run -a tools/test/smoke.sh WiiFin.wad 180

      - name: Boot the DOL
        run: dbus-run-session -- xvfb-run -a tools/test/smoke.sh WiiFin.dol 180

  release:
    if: inputs.release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WiiFin-${{ needs.build.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: WiiFin v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            WiiFin.dol
            WiiFin.wad
            WiiFin-hbc.zip
